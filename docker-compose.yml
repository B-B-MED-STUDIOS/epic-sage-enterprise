version: '3.9'

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: epic
      POSTGRES_PASSWORD: sovereign
      POSTGRES_DB: epic_sage
    volumes: [postgres_data:/var/lib/postgresql/data]
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U epic"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: { context: ., dockerfile: infra/docker/Dockerfile.backend }
    env_file: backend/.env
    environment:
      DATABASE_URL: postgresql://epic:sovereign@db:5432/epic_sage
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: development
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }

  frontend:
    build: { context: ., dockerfile: infra/docker/Dockerfile.frontend }
    ports: ["3000:80"]
    depends_on: [backend]

  prometheus:
    image: prom/prometheus:latest
    volumes: [./infra/monitoring/prometheus:/etc/prometheus]
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:latest
    environment: { GF_SECURITY_ADMIN_PASSWORD: sovereign }
    ports: ["3001:3000"]
    depends_on: [prometheus]

volumes:
  postgres_data:
