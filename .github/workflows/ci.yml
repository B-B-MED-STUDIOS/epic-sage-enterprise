name: EPIC // S.A.G.E — Sovereign CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  AUDIT_SIGNING_KEY: ${{ secrets.AUDIT_SIGNING_KEY }}
  JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
  FOUNDER_FINGERPRINT: ${{ secrets.FOUNDER_FINGERPRINT }}
  DATABASE_URL: sqlite:///./test.db
  ENVIRONMENT: ci

jobs:
  backend-test:
    name: Backend — Sovereign Boot + Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate test AUDIT_SIGNING_KEY if not set
        run: |
          if [ -z "$AUDIT_SIGNING_KEY" ]; then
            echo "AUDIT_SIGNING_KEY=$(python3 -c 'import secrets; print(secrets.token_hex(64))')" >> $GITHUB_ENV
          fi

      - name: Sovereign boot validation
        run: |
          python -c "
          import os, sys
          os.environ.setdefault('AUDIT_SIGNING_KEY', 'test_' + 'a'*64)
          from app.core.config import cfg
          from app.services.governance.sage import SAGERulesEngine, Decision
          from app.services.pricing.engine import compute_price, apply_waterfall
          from datetime import date

          # Waterfall integrity
          w = apply_waterfall(1000.0)
          assert abs(w['platform'] + w['operator'] + w['royalty'] - 1000.0) < 0.02, 'Waterfall violation'

          # Pricing determinism
          r = compute_price('test', 200.0, 10, date.today(), 0.75)
          assert r.recommended_price > 0, 'Pricing engine failed'

          # S.A.G.E rules engine
          sage = SAGERulesEngine()
          assert sage.evaluate_pricing(200, 250, 'p1').decision == Decision.PERMIT
          assert sage.evaluate_pricing(200, 300, 'p1').decision == Decision.ESCALATE
          assert sage.evaluate_booking('p1', 11, 10).decision == Decision.DENY

          print('\u2713 SOVEREIGN BOOT: ALL ASSERTIONS PASSED')
          "

      - name: Run unit tests
        run: |
          if [ -d tests ] && [ "$(ls tests/)" ]; then
            pytest tests/ -v --tb=short
          else
            echo "No tests yet — skipping (scaffold mode)"
          fi

      - name: Ruff lint
        run: |
          pip install ruff -q
          ruff check app/ --output-format=github || true

  frontend-build:
    name: Frontend — TypeScript + Vite Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline 2>/dev/null || npm install

      - name: TypeScript compile check
        run: npx tsc --noEmit || true

      - name: Vite build
        run: npm run build

  docker-build:
    name: Docker Image Build
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        run: docker build -f infra/docker/Dockerfile.backend -t epic-sage-backend:ci .

      - name: Build frontend image
        run: docker build -f infra/docker/Dockerfile.frontend -t epic-sage-frontend:ci .
